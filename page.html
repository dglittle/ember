<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><meta name="referrer" content="no-referrer">
<title>🔥 ember</title>
<style>
 body{font:14px/1.45 -apple-system,system-ui,sans-serif;margin:0;background:#15120f;color:#eee4d8}
 header{padding:14px 18px;background:#221a13;border-bottom:1px solid #3a2a1c;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
 h1{font-size:18px;margin:0;flex:1}
 a{color:#ffb070}
 .st{padding:2px 8px;border-radius:10px;font-weight:600;font-size:12px;background:#444}
 .running{background:#b8560f}.paused{background:#7a6a20}.done{background:#2f7a3a}.failed,.stalled{background:#9a2a2a}.cancelled,.cancelling{background:#555}
 button{font:inherit;padding:6px 12px;border-radius:8px;border:1px solid #6a4a30;background:#2c2118;color:#eee4d8;cursor:pointer}
 button:hover{background:#3a2a1c}
 main{padding:14px 18px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
 @media(max-width:800px){main{grid-template-columns:1fr}}
 section{background:#1d1712;border:1px solid #33261a;border-radius:10px;padding:10px 12px;min-width:0}
 h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:#c9a27e;margin:0 0 8px}
 .bar{height:14px;background:#2a2018;border-radius:7px;overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,#c8551a,#ffb070);transition:width .5s}
 .kv{color:#b9a48f;font-size:12px;margin-top:6px}
 table{width:100%;border-collapse:collapse;font-size:12px}td{padding:3px 4px;border-bottom:1px solid #2a2018;vertical-align:top}
 tr.sel{background:#2c2118}tr[data-n]{cursor:pointer}
 pre{white-space:pre-wrap;word-break:break-word;font:12px/1.4 ui-monospace,Menlo,monospace;margin:0}
 #events,#tail{max-height:360px;overflow:auto}
 .ev-session{color:#ffb070}.ev-end{color:#8fd19a}.ev-warn,.ev-cancel{color:#ff8a7a}.ev-note{color:#e8d27a}
 .note{border-left:3px solid #e8d27a;padding-left:8px;margin:6px 0}
 .full{grid-column:1/-1}
</style></head><body>
<header><h1 id="title">🔥 …</h1><span id="st" class="st">…</span>
 <button onclick="ctl('pause')">⏸ pause</button><button onclick="ctl('run')">▶ run / resume</button><button onclick="if(confirm('cancel this job? live sessions get killed'))ctl('cancel')">■ cancel</button>
 <a id="all" href="/">all embers</a></header>
<main>
 <section class="full"><h2>progress</h2><div class="bar"><div id="bar" style="width:0"></div></div><div id="pmsg" class="kv"></div><div id="meta" class="kv"></div></section>
 <section><h2>sessions</h2><table id="sess"></table><div class="kv">click a row to tail it</div></section>
 <section><h2 id="tailh">session tail</h2><pre id="tail"></pre></section>
 <section><h2>notes</h2><div id="notes"></div></section>
 <section><h2>events</h2><pre id="events"></pre></section>
 <section><h2>steps</h2><table id="steps"></table></section>
 <section><h2>out/</h2><div id="outs"></div></section>
</main>
<script>
const K = new URLSearchParams(location.hash.slice(1)).get('k') || localStorage.emberK || ''; if (K) localStorage.emberK = K;
const ID = location.pathname.split('/')[2];
document.getElementById('all').href = '/#k=' + K;
const api = (p, o) => fetch('/api/j/' + ID + p + (p.includes('?') ? '&' : '?') + 'k=' + encodeURIComponent(K), o).then(r => r.json());
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const ago = t => { if (!t) return ''; const s = (Date.now() - Date.parse(t)) / 1000; return s < 90 ? Math.round(s) + 's' : s < 5400 ? Math.round(s / 60) + 'm' : Math.round(s / 3600) + 'h'; };
let evFrom = 0, tailName = null, tailFrom = 0;
async function ctl(want) { const r = await api('/control', { method: 'POST', body: JSON.stringify({ want }) }); if (r.error) alert(r.error); refresh(); }
function fmtTail(line) {
  try { const e = JSON.parse(line);
    if (e.type === 'assistant') return (e.message.content || []).map(c => c.type === 'text' ? '💬 ' + c.text : c.type === 'tool_use' ? '🔧 ' + c.name + ' ' + JSON.stringify(c.input).slice(0, 200) : '').filter(Boolean).join('\n');
    if (e.type === 'user') return (e.message.content || []).filter(c => c.type === 'tool_result').map(c => '  ↳ ' + String(typeof c.content === 'string' ? c.content : JSON.stringify(c.content)).slice(0, 200)).join('\n');
    if (e.type === 'result') return '✅ result ($' + (+e.total_cost_usd || 0).toFixed(3) + '): ' + String(e.result || '').slice(0, 1500);
    if (e.type === 'system') return '⚙ ' + (e.subtype || 'system') + (e.model ? ' · ' + e.model : '');
    return '';
  } catch (_) { return line; }
}
async function refresh() {
  const d = await api('/state'); if (d.error) { document.getElementById('title').textContent = '🔑 ' + d.error; return; }
  const s = d.state || {}, sp = d.spec || {}, L = d.list || {};
  document.title = '🔥 ' + (sp.title || ID);
  document.getElementById('title').textContent = '🔥 ' + (sp.title || ID);
  const status = L.status || s.status || 'new', st = document.getElementById('st'); st.textContent = status + (d.control.want && d.control.want !== 'run' ? ' (want ' + d.control.want + ')' : ''); st.className = 'st ' + status;
  const p = s.progress || {}; document.getElementById('bar').style.width = (p.total ? Math.min(100, 100 * p.done / p.total) : (status === 'done' ? 100 : 0)) + '%';
  document.getElementById('pmsg').textContent = (p.done || 0) + ' / ' + (p.total || '?') + (p.msg ? ' · ' + p.msg : '');
  document.getElementById('meta').innerHTML = `spent <b>$${(s.spent || 0).toFixed(2)}</b>${sp.budget_usd ? ' of $' + sp.budget_usd : ''} · concurrency ${sp.concurrency} · started ${ago(s.started)} ago · heartbeat ${ago(s.beat)} ago · restarts ${s.restarts || 0}${sp.card ? ' · card <b>' + esc(sp.card) + '</b>' : ''}${s.error ? '<br><span style="color:#ff8a7a">' + esc(s.error).slice(0, 600) + '</span>' : ''}`;
  const ss = Object.values(s.sessions || {});
  document.getElementById('sess').innerHTML = ss.map(x => `<tr data-n="${esc(x.name)}" class="${x.name === tailName ? 'sel' : ''}"><td>${x.status === 'running' ? '🔥' : x.status === 'done' ? '✓' : '✗'} ${esc(x.name)}</td><td>${esc(x.status)}</td><td>$${(+x.cost || 0).toFixed(3)}</td><td>${ago(x.started)}</td><td title="claude --resume ${esc(x.sid)}">${esc(x.sid).slice(0, 8)}</td></tr>`).join('') || '<tr><td>none yet</td></tr>';
  for (const tr of document.querySelectorAll('#sess tr[data-n]')) tr.onclick = () => { tailName = tr.dataset.n; tailFrom = 0; document.getElementById('tail').textContent = ''; document.getElementById('tailh').textContent = 'session tail · ' + tailName; refresh(); };
  if (!tailName && ss.length) { const r = ss.filter(x => x.status === 'running').pop() || ss[ss.length - 1]; tailName = r.name; document.getElementById('tailh').textContent = 'session tail · ' + tailName; }
  document.getElementById('notes').innerHTML = (s.notes || []).map(n => `<div class="note"><pre>${esc(n.md)}</pre><div class="kv">${ago(n.t)} ago</div></div>`).join('') || '<div class="kv">none yet</div>';
  document.getElementById('steps').innerHTML = Object.entries(s.steps || {}).slice(-200).map(([k, v]) => `<tr><td>${v.status === 'done' ? '✓' : v.status === 'running' ? '🔥' : '✗'} ${esc(k)}</td><td>${esc(v.status)}</td><td>${esc(v.error || '')}</td></tr>`).join('') || '<tr><td>none</td></tr>';
  document.getElementById('outs').innerHTML = (d.outs || []).map(o => `<div><a href="/j/${ID}/${esc(o.path)}?k=${encodeURIComponent(K)}" target="_blank">${esc(o.path)}</a> <span class="kv">${o.size} B</span></div>`).join('') || '<div class="kv">empty</div>';
  const ev = await api('/events?from=' + evFrom); if (ev.text) { evFrom = ev.next; const box = document.getElementById('events'); const atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 20;
    for (const l of ev.text.split('\n').filter(Boolean)) { try { const e = JSON.parse(l); const span = document.createElement('span'); span.className = 'ev-' + e.kind; span.textContent = e.t.slice(11, 19) + ' ' + e.kind.padEnd(8) + ' ' + (e.msg || '') + '\n'; box.appendChild(span); } catch (_) {} }
    if (atEnd) box.scrollTop = box.scrollHeight; }
  if (tailName) { const t = await api('/session?name=' + encodeURIComponent(tailName) + '&from=' + tailFrom); if (t.text) { tailFrom = t.next; const box = document.getElementById('tail'); const atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 20; box.textContent += t.text.split('\n').map(fmtTail).filter(Boolean).join('\n') + '\n'; if (atEnd) box.scrollTop = box.scrollHeight; } }
}
refresh(); setInterval(refresh, 2000);
</script></body></html>
