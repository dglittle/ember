<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><meta name="referrer" content="no-referrer">
<title>🔥 embers</title>
<style>
 body{font:14px/1.45 -apple-system,system-ui,sans-serif;margin:0;background:#15120f;color:#eee4d8}
 header{padding:14px 18px;background:#221a13;border-bottom:1px solid #3a2a1c}h1{font-size:18px;margin:0}
 a{color:#ffb070;text-decoration:none}
 .j{display:block;margin:10px 18px;padding:10px 12px;background:#1d1712;border:1px solid #33261a;border-radius:10px}
 .j:hover{border-color:#6a4a30}
 .st{padding:2px 8px;border-radius:10px;font-weight:600;font-size:12px;background:#444;color:#fff}
 .running{background:#b8560f}.paused{background:#7a6a20}.done{background:#2f7a3a}.failed,.stalled{background:#9a2a2a}.cancelled,.cancelling{background:#555}
 .bar{height:6px;background:#2a2018;border-radius:3px;overflow:hidden;margin-top:6px}.bar>div{height:100%;background:#e0712a}
 .kv{color:#b9a48f;font-size:12px}
</style></head><body>
<header><h1>🔥 embers — long-running jobs</h1></header>
<div id="list"></div>
<script>
const K = new URLSearchParams(location.hash.slice(1)).get('k') || localStorage.emberK || ''; if (K) localStorage.emberK = K;
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const ago = t => { if (!t) return ''; const s = (Date.now() - Date.parse(t)) / 1000; return s < 90 ? Math.round(s) + 's' : s < 5400 ? Math.round(s / 60) + 'm' : s < 172800 ? Math.round(s / 3600) + 'h' : Math.round(s / 86400) + 'd'; };
async function refresh() {
  const r = await fetch('/api/jobs?k=' + encodeURIComponent(K)); const js = await r.json();
  if (js.error) { document.getElementById('list').innerHTML = '<p class="j">🔑 need the key: open this page with #k=…</p>'; return; }
  document.getElementById('list').innerHTML = js.map(j => `<a class="j" href="/j/${j.id}/#k=${encodeURIComponent(K)}">
    <span class="st ${j.status}">${j.status}</span> <b>${esc(j.title)}</b> <span class="kv">${esc(j.id)}${j.card ? ' · card ' + esc(j.card) : ''}</span>
    <div class="bar"><div style="width:${j.progress.total ? Math.min(100, 100 * j.progress.done / j.progress.total) : (j.status === 'done' ? 100 : 0)}%"></div></div>
    <div class="kv">${j.progress.done || 0}/${j.progress.total || '?'} ${esc(j.progress.msg || '')} · $${j.spent.toFixed(2)}${j.budget ? ' of $' + j.budget : ''} · ${j.live} live / ${j.sessions} sessions · made ${ago(j.created)} ago${j.ended ? ' · ended ' + ago(j.ended) + ' ago' : ''}</div></a>`).join('') || '<p class="j kv">no embers yet</p>';
}
refresh(); setInterval(refresh, 3000);
</script></body></html>
